<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accessible Python Lessons</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: white;
        color: #111;
        margin: 0;
        padding: 32px;
        max-width: 900px;
    }
    h1 {
        font-size: 48px;
        margin-bottom: 8px;
    }
    p {
        font-size: 28px;
        line-height: 1.5;
    }
    .lesson {
        display: block;
        box-sizing: border-box;
        width: 100%;
        margin: 26px 0;
        padding: 30px;
        font-size: 34px;
        font-weight: bold;
        text-align: left;
        text-decoration: none;
        color: #111;
        background: #fff;
        border: 5px solid #111;
        border-radius: 14px;
    }
    .lesson:hover, .lesson:focus {
        outline: 8px solid #2563eb;
        outline-offset: 4px;
    }
    .small {
        font-size: 22px;
        margin-top: 40px;
    }
</style>
</head>
<body>
    <h1>🐍 Accessible Python Lessons</h1>
    <p>Select today's lesson. It will open directly in Google Colab.</p>

    <a class="lesson"
       href="https://colab.research.google.com/github/vrook56/python-accessible/blob/main/Lesson_2_2.ipynb"
       target="_blank">
       Lesson 2.2 — Variables and Addition
    </a>

    <p class="small">Tip: Press F11 for more screen space.</p>

</html>
