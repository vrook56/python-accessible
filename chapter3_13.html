</style><script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script><script>
let pyodideReadyPromise = null;

async function getPyodide() {
  if (window.pyodide) return window.pyodide;
  if (!pyodideReadyPromise) {
    pyodideReadyPromise = loadPyodide().then(instance => {
      window.pyodide = instance;
      return instance;
    });
  }
  return pyodideReadyPromise;
}

async function runPython(code, inputValues = []) {
  const output = document.getElementById('output');
  try {
    if (!window.pyodide) output.textContent = 'Loading Python...';
    const pyodide = await getPyodide();

    pyodide.globals.set('__user_inputs__', inputValues);
    const indentedCode = code.split('\n').map(line => '    ' + line).join('\n');
    const wrapper = `import builtins, sys, io\n__out = io.StringIO()\n__oldout = sys.stdout\nsys.stdout = __out\n__inputs = list(__user_inputs__)\ndef __fake_input(prompt=''):\n    if prompt:\n        print(prompt, end='')\n    return str(__inputs.pop(0)) if __inputs else ''\n__oldinput = builtins.input\nbuiltins.input = __fake_input\ntry:\n${indentedCode}\nfinally:\n    builtins.input = __oldinput\n    sys.stdout = __oldout\n__out.getvalue()`;

    return await pyodide.runPythonAsync(wrapper);
  } catch (error) {
    return String(error);
  }
}

function getInputs() {
  const inputBox = document.getElementById('inputs');
  if (!inputBox) return [];
  return inputBox.value.trim().split(/\s+/).filter(Boolean);
}

async function runCurrent() {
  const output = document.getElementById('output');
  const feedback = document.getElementById('feedback');
  feedback.textContent = '';
  output.textContent = 'Running...';
  output.textContent = await runPython(document.getElementById('code').value, getInputs());
}

function resetCode() {
  const editor = document.getElementById('code');
  editor.value = editor.dataset.starter || '';
  document.getElementById('output').textContent = '';
  document.getElementById('feedback').textContent = '';
  editor.focus();
}

async function checkWith(testFn) {
  const outputEl = document.getElementById('output');
  const feedbackEl = document.getElementById('feedback');
  feedbackEl.textContent = '';
  outputEl.textContent = 'Checking...';

  const code = document.getElementById('code').value;
  const out = await runPython(code, getInputs());
  outputEl.textContent = out;

  let ok = false;
  let msg = 'Keep working.';
  try {
    [ok, msg] = testFn(out, code);
  } catch (error) {
    console.error('Lesson checker error:', error);
    msg = 'The checker had a problem. Try Run Code and review the output.';
  }
  feedbackEl.textContent = ok ? '🎉 Correct! Great job! 🎉' : (msg || 'Keep working.');
}

function enablePythonTabIndentation() {
  const editor = document.getElementById('code');
  if (!editor) return;

  editor.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab') return;
    event.preventDefault();

    const start = this.selectionStart;
    const end = this.selectionEnd;
    const indent = '    ';

    if (start === end) {
      this.setRangeText(indent, start, end, 'end');
      return;
    }

    const value = this.value;
    const lineStart = value.lastIndexOf('\n', start - 1) + 1;
    const selectedEnd = end > start && value[end - 1] === '\n' ? end - 1 : end;
    const lineEndIndex = value.indexOf('\n', selectedEnd);
    const lineEnd = lineEndIndex === -1 ? value.length : lineEndIndex;
    const block = value.slice(lineStart, lineEnd);
    const indented = block.split('\n').map(line => indent + line).join('\n');
    this.setRangeText(indented, lineStart, lineEnd, 'select');
  });
}

window.addEventListener('DOMContentLoaded', enablePythonTabIndentation);

</script></head><body><main>
